<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Bombeira de Garra — ENBOM 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .pulse-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #ef4444;
      display: inline-block; margin-right: 6px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    .card { transition: transform 0.2s; cursor: pointer; }
    .card:active { transform: scale(0.98); }
    .card .chevron { transition: transform 0.2s; }
    .card.expanded .chevron { transform: rotate(180deg); }
    .funcao-badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      padding: 1px 6px; border-radius: 9999px; vertical-align: middle;
    }
    .funcao-capita { background: #fef3c7; color: #92400e; }
    .funcao-combatente { background: #dbeafe; color: #1e40af; }
    .flag-img {
      display: inline-block; height: 1.1em; width: auto;
      vertical-align: -2px; border-radius: 2px; margin-right: 2px;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.1);
      object-fit: cover;
    }
    .flag-img.lg { height: 1.6em; vertical-align: -4px; }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #4ade80;
      display: inline-block; margin-right: 4px; vertical-align: middle;
      box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7);
      animation: livePulse 2s ease-out infinite;
    }
    @keyframes livePulse {
      0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
      100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
    }
    /* Cores para identificação visual das pistas */
    .pista-badge {
      display: inline-block; font-weight: 700; padding: 2px 8px;
      border-radius: 9999px; color: #fff; font-size: .75rem; line-height: 1rem; white-space: nowrap;
    }
    .pista-A { background: #2563eb; }  /* azul */
    .pista-B { background: #d97706; }  /* âmbar/laranja */

    /* Barra de estatísticas (cabeçalho) */
    .stats-bar {
      background: rgba(0,0,0,.18); color: #fff; font-size: .75rem; line-height: 1rem;
      padding: 6px 12px; display: flex; align-items: center; justify-content: center;
      gap: .5rem; flex-wrap: wrap; border-top: 1px solid rgba(255,255,255,.12);
    }
    .stats-bar b { font-weight: 700; font-size: .85rem; }
    .stats-sep { opacity: .5; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen pb-12">

  <!-- HEADER -->
  <header class="bg-gradient-to-r from-red-700 to-red-800 text-white sticky top-0 z-10 shadow-lg">
    <div class="px-4 py-3">
      <h1 class="text-lg font-bold leading-tight">🚒 BOMBEIRA DE GARRA</h1>
      <p class="text-xs opacity-90" id="subtitulo">XI ENBOM 2026 — CBMAC</p>
      <div class="flex items-center justify-between mt-2 text-xs gap-2">
        <span class="opacity-80 flex items-center gap-2 min-w-0 flex-1">
          <span id="indicadorAoVivo" class="hidden whitespace-nowrap" title="Verifica atualizações a cada 60s">
            <span class="live-dot"></span>ao vivo
          </span>
          <span id="ultimaAtualizacao" class="truncate">Carregando…</span>
        </span>
        <button id="btnAtualizar" class="bg-white/20 hover:bg-white/30 active:bg-white/40 rounded px-3 py-1 font-medium whitespace-nowrap">
          🔄 Atualizar
        </button>
      </div>
    </div>
    <div id="barraStats" class="stats-bar">
      <span>📋 <b id="statTotal">—</b> equipes</span>
      <span class="stats-sep">·</span>
      <span>✅ <b id="statConcluidas">—</b> concluídas</span>
      <span class="stats-sep">·</span>
      <span>⏱️ <b id="statEmProva">—</b> em prova</span>
    </div>
  </header>

  <main id="conteudo" class="px-3 pt-3 space-y-4">
    <div id="loading" class="text-center py-12 text-slate-500">
      <div class="animate-spin inline-block w-8 h-8 border-4 border-red-600 border-t-transparent rounded-full"></div>
      <p class="mt-3 text-sm">Carregando dados…</p>
    </div>
  </main>

  <footer class="mt-8 px-4 text-center text-xs text-slate-500">
    <p>Painel oficial — ENBOM 2026 / CBMAC</p>
  </footer>

  <script>
    const INTERVALO_VERIFICACAO_MS = 60000; // 60s
    let versaoConhecida = null;
    let timerVerificacao = null;

    document.getElementById('btnAtualizar').addEventListener('click', carregarDados);
    document.addEventListener('visibilitychange', function () {
      // Quando a aba volta a ficar visível, verifica imediatamente
      if (!document.hidden) verificarAtualizacoes();
    });
    carregarDados();
    iniciarVerificacaoAutomatica();

    function iniciarVerificacaoAutomatica() {
      if (timerVerificacao) clearInterval(timerVerificacao);
      timerVerificacao = setInterval(verificarAtualizacoes, INTERVALO_VERIFICACAO_MS);
      document.getElementById('indicadorAoVivo').classList.remove('hidden');
    }

    function verificarAtualizacoes() {
      // Não consome quota quando a aba está em background
      if (document.hidden) return;
      google.script.run
        .withSuccessHandler(function (resp) {
          const novaVersao = (resp && resp.cacheVersion) || '';
          // Só recarrega se já temos uma versão de referência E ela mudou
          if (versaoConhecida && novaVersao && novaVersao !== versaoConhecida) {
            carregarDados();
          }
        })
        .withFailureHandler(function () { /* silencia falhas de polling */ })
        .getVersaoPainel();
    }

    function carregarDados() {
      document.getElementById('conteudo').innerHTML =
        '<div class="text-center py-12 text-slate-500">' +
          '<div class="animate-spin inline-block w-8 h-8 border-4 border-red-600 border-t-transparent rounded-full"></div>' +
          '<p class="mt-3 text-sm">Carregando dados…</p>' +
        '</div>';
      google.script.run
        .withSuccessHandler(renderizar)
        .withFailureHandler(mostrarErro)
        .getDadosPainel();
    }

    function mostrarErro(err) {
      document.getElementById('conteudo').innerHTML =
        '<div class="bg-red-100 border border-red-300 text-red-800 rounded p-4 mt-4">' +
          '<p class="font-bold">Erro ao carregar dados</p>' +
          '<p class="text-sm mt-1">' + escapeHtml(err && err.message ? err.message : String(err)) + '</p>' +
          '<button onclick="carregarDados()" class="mt-3 bg-red-600 text-white rounded px-3 py-1 text-sm">Tentar de novo</button>' +
        '</div>';
    }

    let equipesPorNome = {};
    let penalidadesPorEquipe = {};

    function renderizar(dados) {
      document.getElementById('subtitulo').textContent =
        (dados.titulo || 'ENBOM 2026') + (dados.local ? ' — ' + dados.local : '');
      document.getElementById('ultimaAtualizacao').textContent =
        '🕒 ' + formatarHoraISO(dados.ultimaAtualizacao);

      equipesPorNome = {};
      (dados.equipes || []).forEach(function (e) { equipesPorNome[e.nome] = e; });
      penalidadesPorEquipe = dados.penalidadesPorEquipe || {};
      versaoConhecida = dados.cacheVersion || '';

      // Estatísticas no cabeçalho
      const totalEquipes = (dados.equipes || []).length;
      const totalConcluidas = (dados.resultados.concluidas || []).length;
      const totalEmProva = (dados.resultados.emProva || []).length;
      document.getElementById('statTotal').textContent = totalEquipes;
      document.getElementById('statConcluidas').textContent = totalConcluidas + (totalEquipes ? '/' + totalEquipes : '');
      document.getElementById('statEmProva').textContent = totalEmProva;

      const html = [];
      html.push(renderPodio(dados.resultados.podio));
      html.push(renderEmProva(dados.resultados.emProva));
      html.push(renderAguardando(dados.resultados.aguardando));
      html.push(renderConcluidas(dados.resultados.concluidas));
      html.push(renderDesclassificadas(dados.resultados.desclassificadas));

      document.getElementById('conteudo').innerHTML = html.filter(Boolean).join('');
      ativarTogglesCards();
    }

    // ============================================================
    // SEÇÕES
    // ============================================================

    function renderPodio(podio) {
      if (!podio || podio.length === 0) return '';
      const medalhas = ['🥇', '🥈', '🥉'];
      const cores = ['bg-amber-100 border-amber-400', 'bg-slate-200 border-slate-400', 'bg-orange-100 border-orange-400'];
      const items = podio.map(function (eq, i) {
        return (
          '<div class="card ' + cores[i] + ' border-2 rounded-lg p-3" data-equipe="' + escapeHtml(eq.equipe) + '">' +
            '<div class="flex items-center gap-3">' +
              '<div class="text-3xl">' + medalhas[i] + '</div>' +
              '<div class="flex-1 min-w-0">' +
                '<div class="font-bold truncate">' +
                  '<span class="mr-1">' + escapeHtml(eq.bandeira || '🏳️') + '</span>' +
                  escapeHtml(eq.equipe) +
                  renderCapitaInline(eq.equipe) +
                  ' <span class="chevron text-xs text-slate-500">▾</span>' +
                '</div>' +
                '<div class="text-xs text-slate-600 truncate">' + escapeHtml(eq.corporacao || eq.pais || '') + '</div>' +
              '</div>' +
              '<div class="text-right">' +
                '<div class="font-mono font-bold text-lg">' + escapeHtml(eq.tempoTotalStr) + '</div>' +
                '<div class="text-xs text-slate-600">' +
                  'bruto ' + escapeHtml(eq.tempoBrutoStr || '—') + ' + ' + eq.qtdPenalidades + ' pen.' +
                '</div>' +
              '</div>' +
            '</div>' +
            renderDetalhesEquipe(eq.equipe) +
          '</div>'
        );
      }).join('');
      return (
        '<section>' +
          '<h2 class="font-bold text-slate-700 text-sm mb-2 px-1">🏆 PÓDIO</h2>' +
          '<div class="space-y-2">' + items + '</div>' +
        '</section>'
      );
    }

    function renderEmProva(emProva) {
      if (!emProva || emProva.length === 0) return '';
      const items = emProva.map(function (eq) {
        const corporacao = eq.corporacao || eq.pais || '';
        return (
          '<div class="card bg-red-50 border border-red-200 rounded-lg p-3" data-equipe="' + escapeHtml(eq.equipe) + '">' +
            '<div class="flex items-center gap-2">' +
              '<span class="pulse-dot"></span>' +
              '<div class="flex-1 min-w-0">' +
                '<div class="font-bold truncate">' +
                  escapeHtml(eq.bandeira || '🏳️') + ' ' + escapeHtml(eq.equipe) +
                  renderCapitaInline(eq.equipe) +
                  ' <span class="chevron text-xs text-slate-500">▾</span>' +
                '</div>' +
                (corporacao ? '<div class="text-xs text-slate-600 truncate">' + escapeHtml(corporacao) + '</div>' : '') +
              '</div>' +
              (eq.pista ? '<span class="ml-auto pista-badge ' + classePista(eq.pista) + '">Pista ' + escapeHtml(eq.pista) + '</span>' : '') +
            '</div>' +
            (eq.horaInicio ? '<div class="text-xs text-slate-600 mt-1">Início: ' + escapeHtml(eq.horaInicio) + '</div>' : '') +
            renderDetalhesEquipe(eq.equipe) +
          '</div>'
        );
      }).join('');
      return (
        '<section>' +
          '<h2 class="font-bold text-slate-700 text-sm mb-2 px-1">⏱️ EM PROVA</h2>' +
          '<div class="space-y-2">' + items + '</div>' +
        '</section>'
      );
    }

    function renderAguardando(aguardando) {
      if (!aguardando || aguardando.length === 0) return '';
      const items = aguardando.map(function (eq, i) {
        // Mostra a ordem do sorteio se disponível; senão, fallback pra posição na lista
        const ordemDisplay = (eq.ordemProva != null && eq.ordemProva !== '')
          ? eq.ordemProva : (i + 1);
        return (
          '<div class="card bg-white border border-slate-200 rounded-lg p-3" data-equipe="' + escapeHtml(eq.equipe) + '">' +
            '<div class="flex items-center gap-3">' +
              '<div class="font-bold text-slate-400 text-sm w-8">' + ordemDisplay + 'º</div>' +
              '<div class="flex-1 min-w-0">' +
                '<div class="font-bold truncate">' +
                  '<span class="mr-1">' + escapeHtml(eq.bandeira || '🏳️') + '</span>' +
                  escapeHtml(eq.equipe) +
                  renderCapitaInline(eq.equipe) +
                  ' <span class="chevron text-xs text-slate-500">▾</span>' +
                '</div>' +
                '<div class="text-xs text-slate-600 truncate">' + escapeHtml(eq.corporacao || eq.pais || '') + '</div>' +
              '</div>' +
              (eq.pista ? '<span class="ml-auto pista-badge ' + classePista(eq.pista) + '">Pista ' + escapeHtml(eq.pista) + '</span>' : '') +
            '</div>' +
            renderDetalhesEquipe(eq.equipe) +
          '</div>'
        );
      }).join('');
      return (
        '<section>' +
          '<h2 class="font-bold text-slate-700 text-sm mb-2 px-1">⏳ AGUARDANDO (' + aguardando.length + ')</h2>' +
          '<div class="space-y-2">' + items + '</div>' +
        '</section>'
      );
    }

    function renderConcluidas(concluidas) {
      if (!concluidas || concluidas.length === 0) return '';
      const items = concluidas.map(function (eq, i) {
        return (
          '<div class="card bg-white border border-slate-200 rounded-lg p-3" data-equipe="' + escapeHtml(eq.equipe) + '">' +
            '<div class="flex items-start gap-3">' +
              '<div class="font-bold text-slate-400 text-lg w-8">' + (i + 1) + 'º</div>' +
              '<div class="flex-1 min-w-0">' +
                '<div class="font-bold truncate">' +
                  '<span class="mr-1">' + escapeHtml(eq.bandeira || '🏳️') + '</span>' +
                  escapeHtml(eq.equipe) +
                  renderCapitaInline(eq.equipe) +
                  ' <span class="chevron text-xs text-slate-500">▾</span>' +
                '</div>' +
                '<div class="text-xs text-slate-600 truncate">' + escapeHtml(eq.corporacao || eq.pais || '') + '</div>' +
              '</div>' +
              '<div class="text-right">' +
                '<div class="font-mono font-bold text-lg">' + escapeHtml(eq.tempoTotalStr) + '</div>' +
                '<div class="text-xs text-slate-500">' +
                  'bruto ' + escapeHtml(eq.tempoBrutoStr) + ' + ' + eq.qtdPenalidades + ' pen.' +
                '</div>' +
              '</div>' +
            '</div>' +
            renderDetalhesEquipe(eq.equipe) +
          '</div>'
        );
      }).join('');
      return (
        '<section>' +
          '<h2 class="font-bold text-slate-700 text-sm mb-2 px-1">✅ CONCLUÍDAS (' + concluidas.length + ')</h2>' +
          '<div class="space-y-2">' + items + '</div>' +
        '</section>'
      );
    }

    function renderDesclassificadas(dsq) {
      if (!dsq || dsq.length === 0) return '';
      const items = dsq.map(function (eq) {
        return (
          '<div class="card bg-slate-50 border border-slate-300 rounded-lg p-3" data-equipe="' + escapeHtml(eq.equipe) + '">' +
            '<div class="flex items-center gap-2">' +
              '<div class="font-bold text-slate-700 line-through truncate flex-1 min-w-0">' +
                escapeHtml(eq.bandeira || '🏳️') + ' ' + escapeHtml(eq.equipe) +
                renderCapitaInline(eq.equipe) +
              '</div>' +
              '<span class="chevron text-xs text-slate-500">▾</span>' +
            '</div>' +
            (eq.motivoDsqTexto
              ? '<div class="text-xs text-red-700 mt-1">⚠️ ' + escapeHtml(eq.motivoDsqTexto) + '</div>'
              : '<div class="text-xs text-slate-500 mt-1">Desclassificada</div>') +
            renderDetalhesEquipe(eq.equipe) +
          '</div>'
        );
      }).join('');
      return (
        '<section>' +
          '<h2 class="font-bold text-slate-700 text-sm mb-2 px-1">❌ DESCLASSIFICADAS (' + dsq.length + ')</h2>' +
          '<div class="space-y-2">' + items + '</div>' +
        '</section>'
      );
    }

    // Nomes das fases (Anexo D do edital). Usado para enriquecer a exibição
    // das penalidades expandidas no painel público.
    const NOMES_FASES = {
      'I':   'EQUIPAGEM',
      'II':  'MONTAGEM DE LINHA',
      'III': 'TRANSPOSIÇÃO',
      'IV':  'LOCALIZAÇÃO DA VÍTIMA',
      'V':   'ARROMBAMENTO',
    };
    function formatarFase(fase) {
      const k = String(fase || '').trim();
      if (!k) return 'Fase ?';
      const nome = NOMES_FASES[k];
      return nome ? ('Fase ' + k + ' – ' + nome) : ('Fase ' + k);
    }

    // Helpers de formatação de participante/capitã.
    // - Participante comum:  "{POSTO} {NOME_DE_GUERRA}" — ex.: "SGT SOUZA"
    // - Capitã da equipe:    "{POSTO} {NOME_DE_GUERRA} - Cap da Equipe"
    //   (o sufixo "Cap da Equipe" deixa claro que é função, não a patente Capitã)
    function formatarParticipante(p) {
      if (!p) return '';
      const guerra = String(p.nomeDeGuerra || '').trim().toUpperCase();
      const posto = String(p.postoGraduacao || '').trim();
      if (guerra) return (posto ? posto + ' ' : '') + guerra;
      const nomeFb = String(p.nome || '').trim();
      return (posto ? posto + ' ' : '') + nomeFb;
    }

    function obterDisplayCapita(nomeEquipe) {
      const equipe = equipesPorNome[nomeEquipe];
      if (!equipe) return '';
      const capitaPart = (equipe.participantes || []).find(function (p) { return p.ehCapita; });
      if (capitaPart) return formatarParticipante(capitaPart) + ' - Cap da Equipe';
      if (equipe.capita) return String(equipe.capita).trim() + ' - Cap da Equipe';
      return '';
    }

    function renderCapitaInline(nomeEquipe) {
      const display = obterDisplayCapita(nomeEquipe);
      if (!display) return '';
      return ' <span class="text-xs font-normal text-slate-500 whitespace-nowrap">· ' + escapeHtml(display) + '</span>';
    }

    // Painel expandido com participantes + penalidades
    function renderDetalhesEquipe(nomeEquipe) {
      const equipe = equipesPorNome[nomeEquipe];
      const participantes = (equipe && equipe.participantes) || [];
      const penalidades = penalidadesPorEquipe[nomeEquipe] || [];

      const partHtml = participantes.length === 0
        ? '<div class="text-xs text-slate-400 italic">Nenhuma participante cadastrada</div>'
        : participantes.map(function (p) {
            const display = formatarParticipante(p); // "POSTO NOMEDEGUERRA"
            const badge = p.ehCapita
              ? '<span class="funcao-badge funcao-capita">CAP. DA EQUIPE</span>'
              : '';
            const nomeCompleto = (p.nome && p.nome.trim() && p.nomeDeGuerra && p.nome.trim().toUpperCase() !== String(p.nomeDeGuerra).trim().toUpperCase())
              ? '<div class="text-slate-500" style="font-size: 10px;">' + escapeHtml(p.nome) + '</div>'
              : '';
            return (
              '<div class="text-xs text-slate-700 py-1 border-b border-slate-100 last:border-0">' +
                '<div class="flex items-center justify-between gap-2">' +
                  '<div class="flex-1 min-w-0">' +
                    '<span class="font-bold uppercase tracking-wide">' + escapeHtml(display) + '</span>' +
                    nomeCompleto +
                  '</div>' +
                  badge +
                '</div>' +
              '</div>'
            );
          }).join('');

      const penHtml = penalidades.length === 0
        ? ''
        : '<div class="mt-3 pt-2 border-t border-slate-200">' +
            '<div class="text-xs font-bold text-slate-600 mb-1">⚠️ Penalidades (' + penalidades.length + ')</div>' +
            penalidades.map(function (p) {
              return '<div class="text-xs text-slate-700 py-0.5">' +
                '<span class="font-semibold">' + escapeHtml(formatarFase(p.fase)) + ':</span> ' +
                'Item ' + escapeHtml(p.item) + ' — ' + escapeHtml(p.descricao) +
                '</div>';
            }).join('') +
          '</div>';

      return (
        '<div class="detalhes hidden mt-3 pt-2 border-t border-slate-200">' +
          '<div class="text-xs font-bold text-slate-600 mb-1">👥 Equipe (' + participantes.length + ')</div>' +
          partHtml +
          penHtml +
        '</div>'
      );
    }

    // ============================================================
    // INTERAÇÕES
    // ============================================================

    function ativarTogglesCards() {
      document.querySelectorAll('.card[data-equipe]').forEach(function (card) {
        card.addEventListener('click', function (ev) {
          // Não expandir se o clique foi num link/botão dentro do card
          if (ev.target.closest('a, button')) return;
          const det = card.querySelector('.detalhes');
          if (!det) return;
          det.classList.toggle('hidden');
          card.classList.toggle('expanded');
        });
      });
    }

    // ============================================================
    // UTILITÁRIOS
    // ============================================================

    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function classePista(p) {
      const v = String(p || '').trim().toUpperCase();
      return v === 'A' ? 'pista-A' : (v === 'B' ? 'pista-B' : '');
    }

    function formatarHoraISO(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      } catch (e) {
        return iso || '';
      }
    }
  </script>
</body>
</html>
